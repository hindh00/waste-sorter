# category_map.yaml
#
# Maps TACO's fine-grained annotation labels (60 categories) down to the
# small, practical category set this app actually uses (see rules.yaml).
# This is data, not code, deliberately: scripts/prepare_dataset.py reads
# this file, so adding/renaming a category later is a YAML edit here plus
# a matching entry in rules.yaml — never a change to prepare_dataset.py
# itself.
#
# Any TACO label NOT listed here is treated as "other_unlabeled" by
# prepare_dataset.py (with a warning printed), so a future TACO version
# adding new labels doesn't hard-fail the pipeline.
#
# Source label spelling follows TACO's own annotations.json / category
# list (https://github.com/pedropro/TACO). Double check exact spelling
# against your downloaded annotations.json if prepare_dataset.py reports
# unmapped labels — TACO's label strings must match exactly (case and
# punctuation) for the lookup to hit.

